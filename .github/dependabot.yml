# Weekly dependency updates. CI runs on every Dependabot PR; merge the green ones.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      # React and its types must move together, or npm can't install them.
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
      # One PR a week for everything else non-breaking. Majors still come one by one.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Wait until typescript-eslint supports the next majors of these.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/London
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
